<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoxBot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>BoxBot</h1>
      <p>Custom box cutting plans for art handlers. All measurements in inches.</p>
    </header>

    <div class="workspace">
      <form id="box-form">
        <section>
          <h2>Artwork dimensions</h2>
          <div class="field">
            <label for="artworkWidth">Width</label>
            <input type="range" id="artworkWidth" name="artworkWidth" min="1" max="240" step="any" value="24" />
            <div class="value-controls">
              <span class="value"><span id="artworkWidth-val">24"</span></span>
              <div class="nudge-btns">
                <button type="button" class="nudge" data-dim="artworkWidth" data-dir="1" aria-label="Increase width">▲</button>
                <button type="button" class="nudge" data-dim="artworkWidth" data-dir="-1" aria-label="Decrease width">▼</button>
              </div>
            </div>
          </div>
          <div class="field">
            <label for="artworkHeight">Height</label>
            <input type="range" id="artworkHeight" name="artworkHeight" min="1" max="240" step="any" value="36" />
            <div class="value-controls">
              <span class="value"><span id="artworkHeight-val">36"</span></span>
              <div class="nudge-btns">
                <button type="button" class="nudge" data-dim="artworkHeight" data-dir="1" aria-label="Increase height">▲</button>
                <button type="button" class="nudge" data-dim="artworkHeight" data-dir="-1" aria-label="Decrease height">▼</button>
              </div>
            </div>
          </div>
          <div class="field">
            <label for="artworkDepth">Depth</label>
            <input type="range" id="artworkDepth" name="artworkDepth" min="0.25" max="48" step="any" value="2" />
            <div class="value-controls">
              <span class="value"><span id="artworkDepth-val">2"</span></span>
              <div class="nudge-btns">
                <button type="button" class="nudge" data-dim="artworkDepth" data-dir="1" aria-label="Increase depth">▲</button>
                <button type="button" class="nudge" data-dim="artworkDepth" data-dir="-1" aria-label="Decrease depth">▼</button>
              </div>
            </div>
          </div>
          <div class="radios inch-format">
            <span class="orient-label">Display</span>
            <label>
              <input type="radio" name="inchFormat" value="decimal" checked />
              Decimal
            </label>
            <label>
              <input type="radio" name="inchFormat" value="fraction" />
              Fractions (1/32″)
            </label>
          </div>
        </section>

        <section>
          <h2>Padding</h2>
          <div class="grid">
            <label>
              Edge
              <span class="input-wrap">
                <input type="number" name="edgePadding" min="0" step="any" value="1" required />
                <span>in</span>
              </span>
            </label>
            <label>
              Front
              <span class="input-wrap">
                <input type="number" name="frontPadding" min="0" step="any" value="1" required />
                <span>in</span>
              </span>
            </label>
            <label>
              Back
              <span class="input-wrap">
                <input type="number" name="backPadding" min="0" step="any" value="1" required />
                <span>in</span>
              </span>
            </label>
          </div>
        </section>

        <section>
          <h2>Box type</h2>
          <div class="radios">
            <label class="disabled">
              <input type="radio" name="boxType" value="clamshell" disabled />
              Clamshell <span class="soon">(soon)</span>
            </label>
            <label>
              <input type="radio" name="boxType" value="bottom-lid" checked />
              Bottom / lid
            </label>
          </div>
        </section>

        <section>
          <div class="section-head">
            <h2>Cardboard sheet</h2>
            <button type="button" id="sheet-lock" class="lock-btn" aria-pressed="true" title="Unlock to edit sheet size">
              <span class="lock-icon" aria-hidden="true">🔒</span>
              <span class="lock-label">Locked</span>
            </button>
          </div>
          <div class="grid grid-2" id="sheet-fields">
            <label>
              Width
              <span class="input-wrap">
                <input type="number" name="sheetWidth" id="sheetWidth" min="1" step="any" value="48" required disabled />
                <span>in</span>
              </span>
            </label>
            <label>
              Height
              <span class="input-wrap">
                <input type="number" name="sheetHeight" id="sheetHeight" min="1" step="any" value="96" required disabled />
                <span>in</span>
              </span>
            </label>
          </div>
          <div class="sheet-orientation">
            <label class="override-label">
              <input type="checkbox" name="optimizePerpendicular" id="optimizePerpendicular" checked />
              Optimize with perpendicular sheets
            </label>
            <label class="override-label">
              <input type="checkbox" name="overrideOrientation" id="overrideOrientation" />
              Override automatic orientation
            </label>
            <div class="radios" id="orientation-radios">
              <span class="orient-label">Orientation</span>
              <label>
                <input type="radio" name="sheetOrientation" value="horizontal" checked disabled />
                Horizontal
              </label>
              <label>
                <input type="radio" name="sheetOrientation" value="vertical" disabled />
                Vertical
              </label>
            </div>
            <label class="override-label">
              <input type="checkbox" name="centerHorizontal" id="centerHorizontal" />
              Center sheets horizontally
            </label>
            <label class="override-label">
              <input type="checkbox" name="centerVertical" id="centerVertical" />
              Center sheets vertically
            </label>
            <label class="override-label">
              <input type="checkbox" name="showSheetDimensions" id="showSheetDimensions" />
              Show sheet dimensions
            </label>
          </div>
        </section>

        <div class="actions">
          <button type="submit">Generate cutting plan</button>
          <button type="reset">Clear</button>
        </div>
      </form>

      <section id="preview">
        <h2>Artwork preview</h2>
        <canvas id="artwork-canvas" width="640" height="480" aria-label="Artwork size preview"></canvas>
      </section>
    </div>

    <section id="output" hidden>
      <h2>Cutting plan</h2>
      <pre id="output-summary"></pre>
      <p class="note">Printable diagrams will appear here.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
